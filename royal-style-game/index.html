<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f4b">
<title>قلعة الملك — لعبة مطابقة ثلاثية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ================= شاشة التحميل ================= -->
  <section id="screen-boot" class="screen active">
    <div class="boot-crown"></div>
    <h1 class="boot-title">قلعة الملك</h1>
    <p class="boot-sub">لعبة مطابقة ثلاثية — بدون إعلانات</p>
    <div class="boot-bar"><i></i></div>
  </section>

  <!-- ================= خريطة المراحل ================= -->
  <section id="screen-map" class="screen">
    <header class="topbar">
      <div class="res res-lives" id="res-lives">
        <span class="ico ico-heart"></span>
        <b id="lives-count">5</b>
        <small id="lives-timer"></small>
      </div>
      <div class="res res-coins" id="res-coins">
        <span class="ico ico-coin"></span>
        <b id="coins-count">0</b>
        <i class="plus">+</i>
      </div>
      <div class="res res-stars">
        <span class="ico ico-star"></span>
        <b id="stars-count">0</b>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="الإعدادات">
        <span class="ico ico-gear"></span>
      </button>
    </header>

    <div class="map-scroll" id="map-scroll">
      <div class="map-inner" id="map-inner"></div>
    </div>

    <footer class="mapbar">
      <button class="mapbar-btn" id="btn-how">القواعد</button>
      <button class="mapbar-btn primary" id="btn-play">العب</button>
      <button class="mapbar-btn" id="btn-rescue">إنقاذ</button>
      <button class="mapbar-btn" id="btn-shop">المتجر</button>
    </footer>
  </section>

  <!-- ================= مهمّات الإنقاذ ================= -->
  <section id="screen-rescue" class="screen">
    <header class="gamebar">
      <button class="icon-btn" id="btn-rescue-quit" aria-label="خروج">
        <span class="ico ico-back"></span>
      </button>
      <div class="moves-box" id="rescue-time-box">
        <span class="moves-label">الوقت</span>
        <b id="rescue-time">1:00</b>
      </div>
      <div class="rescue-title" id="rescue-name">المهمّة ١</div>
      <div class="score-box">
        <span class="score-label">الذهب</span>
        <b id="rescue-gold">0/0</b>
      </div>
    </header>

    <div class="rescue-wrap" id="rescue-wrap">
      <canvas id="rescue-canvas"></canvas>
    </div>

    <footer class="rescue-bar">
      <p class="rescue-hint" id="rescue-hint"></p>
      <button class="mapbar-btn" id="btn-rescue-retry">إعادة</button>
    </footer>
  </section>

  <!-- ================= شاشة اللعب ================= -->
  <section id="screen-game" class="screen">
    <header class="gamebar">
      <button class="icon-btn" id="btn-quit" aria-label="خروج">
        <span class="ico ico-back"></span>
      </button>
      <div class="moves-box">
        <span class="moves-label">الحركات</span>
        <b id="moves-count">20</b>
      </div>
      <div class="goals-box" id="goals-box"></div>
      <div class="score-box">
        <span class="score-label">النقاط</span>
        <b id="score-count">0</b>
      </div>
    </header>

    <div class="board-wrap" id="board-wrap">
      <div class="board-stage">
        <div class="pennant-bar">
          <div class="pennant-line"></div>
          <div class="pennants"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="level-ribbon"><span id="level-label">المرحلة ١</span></div>
        <canvas id="board-canvas"></canvas>
        <div class="board-base"></div>
      </div>
      <div class="banner" id="banner"></div>
    </div>

    <footer class="boosterbar" id="boosterbar"></footer>
  </section>

</div>

<!-- ================= النوافذ المنبثقة ================= -->
<div id="modal-root"></div>

<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/levels.js"></script>
<script src="js/board.js"></script>
<script src="js/rescue-sim.js"></script>
<script src="js/rescue-levels.js"></script>
<script src="js/effects.js"></script>
<script src="js/game.js"></script>
<script src="js/rescue.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
